<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<title>근태 로그</title>

<link rel="stylesheet" href="/web/css/common.css">
<link rel="stylesheet" href="/web/css/layout.css">
<link rel="stylesheet" href="/web/css/menu.css">
<link rel="stylesheet" href="/web/css/grid.css">

<script src="/web/js/layout.js"></script>

<script src="/web/attendance/attendance.js"></script>

</head>

<body>

<div id="header"></div>

<div id="menu"></div>

<div id="content">
    <div class="page-title">
        <div>
            <h2>근태 로그</h2>
            <span>근태 이력 현황</span>
        </div>
    </div>

    <div class="search-box">
        <table>
            <tr>
                <td>아이디</td>
                <td><input type="text" id="login_id"></td>
                <td>일자</td>
                <td>
                    <input type="date" id="work_date">
                </td>
                <td><button class="btn-search" onclick="loadAttendanceList()">조회</button></td>
                <td><button class="btn-default" onclick="searchReset()">초기화</
            </tr>
        </table>
    </div>

    <div class="grid-box">
        <table id="tblData">
        <thead>
            <tr>
            <th>로그인 아이디</th>
            <th>근태일</th>
            <th>출근시간</th>
            <th>퇴근시간</th>
            <th>출근위도</th>
            <th>출근경도</th>
            <th>퇴근위도</th>
            <th>퇴근경도</th>
            <th>상태</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
        </table>
    </div>

    <div class="paging"></div>
</div>

<div id="footer"></div>

<script>
window.onload=async()=>{
    await loadLayout();
    loadAttendanceList();
}
</script>
</body>
</html>
