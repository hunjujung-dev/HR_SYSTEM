<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>로그인</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/web/css/common.css">

<script src="/web/login/login.js"></script>

</head>
<body>
    
    <div class="login-box">        
        <table border="0">
            <tr>
                <td width="130" align="right">
                    <img src="/web/img/logo_1.png" width="70" height="47" border="0">
                </td>
                <td>
                    <h1 style="vertical-align: middle">HR 로그인</h1>
                </td>
            </tr>
        </table>
        <br>
        <table border="0">
            <tr>
                <td class="login-label">
                    아이디
                </td>
                <td>
                    <input id="id" placeholder="아이디를 입력하세요" onkeyup="this.value = this.value.toUpperCase()">
                </td>
            </tr>
            <tr>
                <td class="login-label">
                    비밀번호
                </td>
                <td>
                    <input id="pwd" type="password" placeholder="비밀번호를 입력하세요">
                </td>
            </tr>
            <tr height="120">
                <td align="center" colspan="2">
                    <button onclick="login()">로그인</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
