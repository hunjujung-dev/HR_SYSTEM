<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<title>부서 등록</title>

<link rel="stylesheet" href="/web/css/common.css">
<link rel="stylesheet" href="/web/css/layout.css">
<link rel="stylesheet" href="/web/css/menu.css">
<link rel="stylesheet" href="/web/css/grid.css">

<script src="/web/js/layout.js"></script>

<script src="/web/employee/department.js"></script>
</head>>

<body>

<div id="header"></div>

<div id="menu"></div>

<div id="content">
    <div class="page-title">
        <h2>부서 등록</h2>
    </div>

    <table class="grid-form">
        <tr>
            <th width="180">부서코드</th>
            <td><input id="dept_cd" type="text" maxlength="20"></td>
        </tr>
        <tr>
            <th>부서명</th>
            <td><input id="dept_name" type="text" maxlength="100"></td>
        </tr>
        <tr>
            <th>상위부서</th>
            <td>
                <input id="parent_cd" type="text">
                <button onclick="popupDepartment();">찾기</button>
            </td>
        </tr>
        <tr>
            <th>정렬순서</th>
            <td><input id="sort_no" type="number" value="1"></td>
        </tr>
        <tr>
            <th>사용여부</th>
            <td>
                <select id="use_yn">
                    <option value="Y">사용</option>
                    <option value="N">미사용</option>
                </select>
            </td>
        </tr>
        <tr height="80">
            <th></th>
            <td align="center">
                <button class="btn-edit" onclick="saveAddDepartment()">저장</button>
                <button class="btn-default" onclick="history.back()">목록</button>
            </td>
        </tr>
    </table>
</div>

<div id="footer"></div>

<script>
window.onload=async()=>{
    await loadLayout();
}
</script>
</body>
</html>
