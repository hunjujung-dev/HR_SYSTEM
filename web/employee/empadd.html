<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<title>직원 등록</title>

<link rel="stylesheet" href="/web/css/common.css">
<link rel="stylesheet" href="/web/css/layout.css">
<link rel="stylesheet" href="/web/css/menu.css">
<link rel="stylesheet" href="/web/css/grid.css">

<script src="/web/js/layout.js"></script>

<script src="/web/employee/employee.js"></script>
</head>>

<body>

<div id="header"></div>

<div id="menu"></div>

<div id="content">
    <div class="page-title">
        <h2>직원 등록</h2>
    </div>
    <table class="grid-form">
        <tr>
            <th width="180">직원코드</th>
            <td><input id="emp_no" type="text" maxlength="20" placeholder="직원코드를 입력하세요"></td>
        </tr>
        <tr>
            <th>직원명</th>
            <td><input id="emp_name" type="text" maxlength="100"></td>
        </tr>
        <tr>
            <th>로그인 아이디</th>
            <td>
                <input id="login_id" type="text">
                <button onclick="checkUserId()">중복체크</button>

            </td>
        </tr>
        <tr>
            <th>비밀번호</th>
            <td>
                <input id="pwd" type="password">

            </td>
        </tr>
        <tr>
            <th>비밀번호 확인</th>
            <td>
                <input id="pwd_chk" type="password" placeholder="비밀번호를 동일하게 입력하세요">
            </td>
        </tr>
        <tr>
            <th>부서</th>
            <td>
                <input id="dept_cd" type="text">
                <button onclick="popupDepartment();">찾기</button>
            </td>
        </tr>
        <tr>
            <th>직급</th>
            <td>
                <input id="position_cd" type="text">
                <button onclick="popupPosition();">찾기</button>
            </td>
        </tr>
        <tr>
            <th>휴대폰</th>
            <td>
                <input id="phone" type="text" placeholder="010-0000-0000 형태로 입력하세요">
            </td>
        </tr>
        <tr>
            <th>입사일</th>
            <td>
                <input id="join_date" type="text" placeholder="2026-01-01 형태로 입력하세요">
            </td>
        </tr>
        <tr>
            <th>출퇴근 GPS 지정</th>
            <td>
                <input id="gps_id" type="text" size="5" readonly>
                <input id="gps_code" type="text" size="3" readonly>
                <input id="gps_name" type="text" size="10" readonly>
                <button onclick="popupLocation();">찾기</button>
            </td>
        </tr>
        <tr>
            <th>상태</th>
            <td>
                <select id="status">
                    <option value="">선택하세요</option>
                    <option value="ACTIVE">재직</option>
                    <option value="LEAVE">휴직</option>
                    <option value="RETIRE">퇴사</option>
                </select>
            </td>
        </tr>
        <tr>
            <th>사용여부</th>
            <td>
                <select id="use_yn">
                    <option value="Y">사용</option>
                    <option value="N">미사용</option>
                </select>
            </td>
        </tr>
        <tr height="80">
            <th></th>
            <td align="center">
                <button class="btn-edit" onclick="saveAddEmployee()">저장</button>
                <button class="btn-default" onclick="history.back()">목록</button>
            </td>
        </tr>
    </table>
</div>

<div id="footer"></div>

<script>
window.onload=async()=>{
    await loadLayout();
}
</script>
</body>
</html>
