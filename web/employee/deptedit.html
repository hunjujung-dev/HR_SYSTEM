<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<title>부서 수정</title>

<link rel="stylesheet" href="/web/css/common.css">
<link rel="stylesheet" href="/web/css/layout.css">
<link rel="stylesheet" href="/web/css/menu.css">
<link rel="stylesheet" href="/web/css/grid.css">
<script>
    const params = new URLSearchParams(location.search);
    const dept_cd = params.get("dept_cd");
</script>
<script src="/web/js/layout.js"></script>

<script src="/web/employee/department.js"></script>
</head>>

<body>

<div id="header"></div>

<div id="menu"></div>

<div id="content">
    <div class="page-title">
        <h2>부서 수정</h2>
    </div>

    <div class="card">
        <table class="form-table">
            <tr>
                <th width="180">부서코드</th>
                <td>
                    <input type="text" id="dept_cd" readonly disabled class="readonly">
                </td>
            </tr>
            <tr>
                <th>부서명</th>
                <td>
                    <input type="text" id="dept_name" maxlength="100">
                </td>
            </tr>
            <tr>
                <th>상위부서</th>
                <td>
                    <div style="display:flex;gap:8px;">
                        <input type="text" id="parent_cd" readonly disabled>
                        <button type="button" class="btn-sm" onclick="popupDepartment();">찾기</button>
                    </div>
                </td>
            </tr>
            <tr>
                <th>정렬순서</th>
                <td>
                    <input type="number" id="sort_no" value="1">
                </td>
            </tr>
            <tr>
                <th>사용여부</th>
                <td>
                    <select id="use_yn">
                        <option value="Y">사용</option>
                        <option value="N">미사용</option>
                    </select>
                </td>
            </tr>
            <tr height="80">
            <th></th>
            <td align="center">
                <button class="btn-edit" onclick="saveEditDepartment()">저장</button>
        <button class="btn-del" onclick="deleteDepartment()">삭제</button>
        <button class="btn-default" onclick="history.back()">목록</button>
            </td>
        </tr>
        </table>
    </div>
</div>

<div id="footer"></div>

<script>
window.onload=async()=>{
    await loadLayout();
    loadEditDepartment();
}
</script>
</body>
</html>
