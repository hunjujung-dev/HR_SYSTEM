<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<title>부서관리</title>

<link rel="stylesheet" href="/web/css/common.css">
<link rel="stylesheet" href="/web/css/layout.css">
<link rel="stylesheet" href="/web/css/menu.css">
<link rel="stylesheet" href="/web/css/grid.css">

<script src="/web/js/layout.js"></script>

<script src="/web/employee/department.js"></script>

</head>

<body>

<div id="header"></div>

<div id="menu"></div>

<div id="content">
    <div class="page-title">
        <div>
            <h2>부서관리</h2>
            <span>부서목록</span>
        </div>

        <button class="btn-primary" onclick="departmentAdd()">신규등록</button>
    </div>

    <div class="search-box">
        <table>
            <tr>
                <td>부서명</td>
                <td><input type="text" id="dept_name"></td>
                <td>정렬순서</td>
                <td><input type="text" id="sort_no"></td>
                <td>사용여부</td>
                <td>
                    <select id="use_yn">
                        <option value="">전체</option>
                        <option value="Y">예</option>
                        <option value="N">아니오</option>
                    </select>
                </td>
                <td><button class="btn-search" onclick="loadDepartment()">조회</button></td>
                <td><button class="btn-default" onclick="searchReset()">초기화</button></td>
            </tr>
        </table>
    </div>

    <div class="grid-box">
        <table id="tblData">
        <thead>
            <tr>
            <th width="50"></th>
            <th width="80">부서코드</th>
            <th>부서명</th>
            <th>상위부서</th>
            <th>정렬순서</th>
            <th>사용여부</th>
            <th width="100">&nbsp;</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
        </table>
    </div>

    <div class="paging"></div>
</div>

<div id="footer"></div>

<script>
window.onload=async()=>{
    await loadLayout();
    loadDepartment();
}
</script>
</body>
</html>
