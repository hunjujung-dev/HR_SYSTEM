<table id="tblEmployee" class="grid">
</table>

<script>
    Grid.load({

        table:"#tblData",

        checkbox:true,

        url:"/employee/list",

        columns:[

            {
                title:"사번",
                field:"emp_no",
                width:100
            },

            {
                title:"이름",
                field:"emp_name"
            },

            {
                title:"부서",
                field:"dept_name"
            },

            {
                title:"직급",
                field:"position_name"
            },

            {
                title:"상태",
                field:"status"
            }

        ],

        dblclick:function(row){

            location.href="/web/employee/edit.html?id="+row.id;

        }

    });
</script>
