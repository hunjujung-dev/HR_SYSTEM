<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<title>장치관리</title>

<link rel="stylesheet" href="/web/css/common.css">
<link rel="stylesheet" href="/web/css/layout.css">
<link rel="stylesheet" href="/web/css/menu.css">
<link rel="stylesheet" href="/web/css/grid.css">

<script src="/web/js/layout.js"></script>

<script src="/web/device/device.js"></script>

</head>

<body>

<div id="header"></div>

<div id="menu"></div>

<div id="content">
    <div class="page-title">
        <div>
            <h2>장치 관리</h2>
            <span>장치 요청 목록</span>
        </div>
    </div>

    <div class="search-box">
        <table>
            <tr>
                <td>장치명</td>
                <td><input type="text" id="device_name"></td>
                <td>아이디</td>
                <td><input type="text" id="login_id"></td>
                <td>상태</td>
                <td>
                    <select id="status">
                        <option value="">전체</option>
                        <option value="PENDING">대기</option>
                        <option value="APPROVED">승인</option>
                        <option value="REJECTED">거부</option>
                    </select>
                </td>
                <td><button class="btn-search" onclick="loadDeviceList()">조회</button></td>
                <td><button class="btn-default" onclick="searchReset()">초기화</button></td>
            </tr>
        </table>
    </div>

    <div class="grid-box">
        <table id="tblData">
        <thead>
            <tr>
            <th width="50"></th>
            <th width="80">장치코드</th>
            <th>장치명</th>
            <th>장비타입</th>
            <th>직원코드</th>
            <th>직원명</th>            
            <th>핸드폰</th>
            <th>상태</th>
            <th>등록일</th>
            <th>승인일</th>
            <th width="100">&nbsp;</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
        </table>
    </div>

    <div class="paging"></div>
</div>

<div id="footer"></div>

<script>
window.onload=async()=>{
    await loadLayout();
    loadDeviceList();
}
</script>
</body>
</html>
