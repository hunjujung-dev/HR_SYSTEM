<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>HR SYSTEM Dashboard</title>

    <link rel="stylesheet" href="/web/css/common.css">
    <link rel="stylesheet" href="/web/css/theme.css">
    <link rel="stylesheet" href="/web/css/layout.css">
    <link rel="stylesheet" href="/web/css/menu.css">
    <link rel="stylesheet" href="/web/dashboard/dashboard.css">

    <script src="/web/js/common.js"></script>
    <script src="/web/js/dialog.js"></script>
    <script src="/web/js/loading.js"></script>
    <script src="/web/js/api.js"></script>
    <script src="/web/js/layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="header"></div>
<div id="menu"></div>

<div id="content" class="dashboard">

    <div class="dashboard-cards">

        <div class="dash-card blue">
            <div class="icon">👨</div>
            <div class="value" id="empCount">0</div>
            <div class="title">직원수</div>
        </div>

        <div class="dash-card green">
            <div class="icon">📍</div>
            <div class="value" id="checkIn">0</div>
            <div class="title">오늘 출근</div>
        </div>

        <div class="dash-card green">
            <div class="icon">🕒</div>
            <div class="value" id="checkOut">0</div>
            <div class="title">오늘 퇴근</div>
        </div>

        <div class="dash-card yellow">
            <div class="icon">📱</div>
            <div class="value" id="pending">0</div>
            <div class="title">승인대기</div>
        </div>

        <div class="dash-card blue">
            <div class="icon">📡</div>
            <div class="value" id="gps">0</div>
            <div class="title">GPS 등록</div>
        </div>

        <div class="dash-card red">
            <div class="icon">💼</div>
            <div class="value" id="todayWork">0</div>
            <div class="title">근무중</div>
        </div>

    </div>

    <div class="dashboard-grid">

        <div class="panel">
            <div class="panel-title">출근 현황</div>
            <canvas id="attendanceChart"></canvas>
        </div>

        <div class="panel">
            <div class="panel-title">부서별 직원수</div>
            <canvas id="deptChart"></canvas>
        </div>

        <div class="panel">
            <div class="panel-title">최근 출근</div>
            <ul id="recentCheckin" class="list"></ul>
        </div>

        <div class="panel">
            <div class="panel-title">공지사항</div>
            <ul id="noticeList" class="list"></ul>
        </div>

    </div>

</div>

<div id="footer"></div>

<script src="/web/dashboard/dashboard.js"></script>
</body>
</html>
