<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<title>회사 위치 설정</title>

<link rel="stylesheet" href="/web/css/common.css">
<link rel="stylesheet" href="/web/css/layout.css">
<link rel="stylesheet" href="/web/css/menu.css">
<link rel="stylesheet" href="/web/css/grid.css">

<script src="/web/js/layout.js"></script>

<script src="/web/location/location.js"></script>

</head>

<body>

<div id="header"></div>

<div id="menu"></div>

<div id="content">
    <div class="page-title">
        <div>
            <h2>회사 위치 설정</h2>
            <span>회사 위치 목록</span>
        </div>

        <button class="btn-primary" onclick="locationAdd()">신규등록</button>
    </div>

    <div class="search-box">
        <table>
            <tr>
                <td>회사명</td>
                <td><input type="text" id="company_name"></td>
                <td>사용여부</td>
                <td>
                    <select id="use_yn">
                        <option value="">전체</option>
                        <option value="Y">사용</option>
                        <option value="N">미사용</option>
                    </select>
                </td>
                <td><button class="btn-search" onclick="loadLocationList()">조회</button></td>
                <td><button class="btn-default" onclick="searchReset()">초기화</button></td>
            </tr>
        </table>
    </div>

    <div class="grid-box">
        <table id="tblData">
        <thead>
            <tr>
            <th width="50"></th>
            <th width="80">회사코드</th>
            <th>GPS코드</th>
            <th>회사명</th>
            <th>위도</th>
            <th>경도</th>
            <th>정확도</th>
            <th>상태</th>
            <th>등록일</th>
            <th width="100">&nbsp;</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
        </table>
    </div>

    <div class="paging"></div>
</div>

<div id="footer"></div>

<script>
window.onload=async()=>{
    await loadLayout();
    loadLocationList();
}
</script>
</body>
</html>
