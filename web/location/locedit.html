<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<title>회사 위치 수정</title>

<link rel="stylesheet" href="/web/css/common.css">
<link rel="stylesheet" href="/web/css/layout.css">
<link rel="stylesheet" href="/web/css/menu.css">
<link rel="stylesheet" href="/web/css/grid.css">

<script src="/web/js/layout.js"></script>

<script src="/web/location/location.js"></script>
</head>>

<body>

<div id="header"></div>

<div id="menu"></div>

<div id="content">
    <div class="page-title">
        <h2>회사 위치 수정</h2>
    </div>
    <table class="grid-form">
        <tr>
            <th width="180">회사코드</th>
            <td><input id="company_id" type="text" maxlength="20"  readonly disabled></td>
        </tr>
        <tr>
            <th width="180">GPS 코드</th>
            <td><input id="loc_code" type="text" maxlength="20"  readonly disabled></td>
        </tr>
        <tr>
            <th>회사명</th>
            <td><input id="company_name" type="text" maxlength="100"></td>
        </tr>
        <tr>
            <th>위도</th>
            <td>
                <input id="lat" type="text">
            </td>
        </tr>
        <tr>
            <th>경도</th>
            <td>
                <input id="lng" type="text">
            </td>
        </tr>
        <tr>
            <th>정확도</th>
            <td>
                <input id="accuracy" type="text" placeholder="정확도를 입력하세요">
            </td>
        </tr>
        <tr>
            <th>메모</th>
            <td>
                <input id="remark" type="text">
            </td>
        </tr>
        <tr>
            <th>사용여부</th>
            <td>
                <select id="use_yn">
                    <option value="Y">사용</option>
                    <option value="N">미사용</option>
                </select>
            </td>
        </tr>
        <tr height="80">
            <th></th>
            <td align="center">
                <button class="btn-edit" onclick="saveUpdateLocation()">저장</button>
                <button class="btn-default" onclick="history.back()">목록</button>
            </td>
        </tr>
    </table>
</div>

<div id="footer"></div>

<script>
window.onload=async()=>{
    await loadLayout();
    loadEditLocation();
}
</script>
</body>
</html>
